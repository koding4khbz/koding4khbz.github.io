<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ratiby Support</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #14251c;
        background: #fafcfa;
        font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 640px;
        margin: 48px auto;
        padding: 32px;
        border: 1px solid #dce5df;
        border-radius: 16px;
        background: #ffffff;
      }

      h1,
      h2 {
        line-height: 1.2;
      }

      h1 {
        color: #006c35;
      }

      h2 {
        margin-top: 32px;
        font-size: 1.25rem;
      }

      a {
        color: #006c35;
      }

      a:focus-visible {
        outline: 3px solid #9bcdb2;
        outline-offset: 3px;
      }

      li + li {
        margin-top: 8px;
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        main {
          margin: 20px auto;
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ratiby</h1>

      <p>
        Support email:
        <a href="mailto:eddahbirs@gmail.com">eddahbirs@gmail.com</a>
      </p>

      <h2>Troubleshooting</h2>
      <ol>
        <li>Close and reopen Ratiby.</li>
        <li>Update Ratiby to the latest version.</li>
        <li>Restart your device and try again.</li>
      </ol>

      <h2>Legal</h2>
      <ul>
        <li>
          <a href="https://koding4khbz.github.io/ratiby/privacy-policy.html">Privacy Policy</a>
        </li>
        <li>
          <a href="https://koding4khbz.github.io/ratiby/terms-of-use.html">Terms of Use</a>
        </li>
      </ul>
    </main>
  </body>
</html>
